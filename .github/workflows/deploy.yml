name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos que exige el despliegue oficial de Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; si llegan varios push seguidos, gana el último.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Construir sitio estático
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Construye y captura el HTML renderizado en out/ (ver scripts/export-static.mjs).
      - run: npm run export

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Desplegar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
